<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sonify Ops · 日活与发版控制台</title>
<style>
  :root {
    --bg: #121212;
    --surface1: #181818;
    --surface2: #222222;
    --border: rgba(255,255,255,0.08);
    --text: #F5F5F5;
    --muted: #A3A3A3;
    --gold: #E5A93C;
    --green: #1DB954;
    --danger: #EF5350;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 24px 18px 64px; }
  header {
    display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    margin-bottom: 22px;
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .vinyl {
    width: 38px; height: 38px; border-radius: 50%;
    background: radial-gradient(circle at center, var(--gold) 0 18%, #111 19% 46%, #2a2a2a 48%, #111 52% 100%);
    border: 1px solid rgba(229,169,60,0.45);
  }
  h1 { font-size: 20px; margin: 0; letter-spacing: 0.2px; }
  .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  button, .pill {
    background: var(--surface2); color: var(--text); border: 1px solid var(--border);
    border-radius: 999px; padding: 7px 14px; font-size: 12px; cursor: pointer;
    transition: all .15s ease;
  }
  button:hover { border-color: rgba(229,169,60,0.55); }
  button.active { background: var(--gold); color: #111; font-weight: 700; border-color: var(--gold); }
  button.primary { background: var(--gold); color: #111; font-weight: 700; border-color: var(--gold); }
  button.danger { background: rgba(239,83,80,0.16); color: var(--danger); border-color: rgba(239,83,80,0.4); }
  .kpi-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 12px; margin-bottom: 18px;
  }
  .card {
    background: var(--surface1); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 16px;
  }
  .kpi-label { font-size: 12px; color: var(--muted); }
  .kpi-val { font-size: 28px; font-weight: 700; margin-top: 6px; font-variant-numeric: tabular-nums; }
  .kpi-sub { font-size: 11px; color: var(--muted); margin-top: 4px; }
  .gold { color: var(--gold); }
  .green { color: var(--green); }
  .red { color: var(--danger); }
  .grid-2 { display: grid; grid-template-columns: 1.6fr 1fr; gap: 14px; margin-bottom: 14px; }
  .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 14px; }
  @media (max-width: 900px) {
    .grid-2, .grid-3 { grid-template-columns: 1fr; }
  }
  .card-title {
    font-size: 14px; font-weight: 600; margin: 0 0 12px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .bar-row { margin-bottom: 10px; }
  .bar-meta { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 4px; gap: 8px; }
  .bar-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar-track { height: 7px; background: var(--surface2); border-radius: 999px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--gold), #f3c86b); }
  .bar-fill.green-bar { background: linear-gradient(90deg, var(--green), #4be384); }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 500; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .badge {
    display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600;
    background: var(--surface2); color: var(--text);
  }
  .badge.force { background: rgba(239,83,80,0.2); color: var(--danger); }
  .badge.ok { background: rgba(29,185,84,0.18); color: var(--green); }
  .login-box {
    max-width: 390px; margin: 14vh auto; background: var(--surface1);
    border: 1px solid var(--border); border-radius: 18px; padding: 28px;
  }
  input[type=password], input[type=number], textarea {
    width: 100%; background: var(--surface2); color: var(--text);
    border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px;
    font-size: 13px; outline: none;
  }
  input:focus, textarea:focus { border-color: var(--gold); }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 5px; }
  .switch-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 12px; background: var(--surface2); border-radius: 10px; margin-bottom: 12px;
  }
  .crash-item {
    border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px;
    background: rgba(255,255,255,0.02);
  }
  .crash-item summary { cursor: pointer; font-size: 12px; display: flex; justify-content: space-between; gap: 10px; }
  pre.trace {
    margin: 8px 0 0; padding: 10px; background: #0d0d0d; border-radius: 8px;
    font-size: 11px; overflow-x: auto; max-height: 220px; color: #ddd;
  }
  .chart-wrap { width: 100%; overflow-x: auto; }
  .empty { color: var(--muted); font-size: 12px; padding: 12px 0; }
  .toast {
    position: fixed; bottom: 20px; right: 20px; background: var(--surface2);
    border: 1px solid var(--gold); color: var(--text); padding: 10px 16px;
    border-radius: 999px; font-size: 12px; display: none; z-index: 99;
  }
</style>
</head>
<body>
<div id="loginView" class="login-box" style="display:none;">
  <div class="brand" style="margin-bottom:18px;">
    <div class="vinyl"></div>
    <div>
      <h1>Sonify Ops 控制台</h1>
      <div class="sub">sonify.zhangbing.tech · 日活统计与发版管理</div>
    </div>
  </div>
  <div class="field">
    <label for="tokenInput">管理员访问口令（Admin Token）</label>
    <input id="tokenInput" type="password" placeholder="粘贴服务端生成的 Admin Token" autocomplete="current-password" />
  </div>
  <div id="loginErr" class="red" style="font-size:12px;margin-bottom:10px;min-height:16px;"></div>
  <button class="primary" style="width:100%;padding:10px;" onclick="doLogin()">进入看板</button>
</div>

<div id="appView" class="wrap" style="display:none;">
  <header>
    <div class="brand">
      <div class="vinyl"></div>
      <div>
        <h1>Sonify 数据看板 & 发版控制</h1>
        <div class="sub" id="updatedAt">加载中…</div>
      </div>
    </div>
    <div class="controls">
      <button id="d7" onclick="setDays(7)">7 天</button>
      <button id="d14" class="active" onclick="setDays(14)">14 天</button>
      <button id="d30" onclick="setDays(30)">30 天</button>
      <button onclick="loadAll()">刷新</button>
      <button class="danger" onclick="doLogout()">退出</button>
    </div>
  </header>

  <section class="kpi-grid" id="kpiGrid"></section>

  <section class="grid-2">
    <div class="card">
      <div class="card-title">
        <span>日活（DAU）与每日新增趋势</span>
        <span class="sub">暖金折线 = DAU · 翠绿柱 = 新增设备</span>
      </div>
      <div class="chart-wrap" id="trendChart"></div>
    </div>
    <div class="card">
      <div class="card-title">
        <span>线上版本与强制更新控制</span>
        <span id="forceBadge" class="badge">--</span>
      </div>
      <div id="releaseMeta" class="sub" style="margin-bottom:12px;">尚未发布版本</div>
      <div class="switch-row">
        <div>
          <div style="font-size:13px;font-weight:600;">开启强制更新（Force Update）</div>
          <div class="sub">开启后低版本用户将无法跳过升级弹窗</div>
        </div>
        <input id="forceToggle" type="checkbox" style="width:20px;height:20px;accent-color:#EF5350;" />
      </div>
      <div class="field">
        <label for="minVerInput">最低兼容 versionCode（低于此值同样触发强制更新）</label>
        <input id="minVerInput" type="number" min="1" value="1" />
      </div>
      <div class="field">
        <label for="notesInput">更新日志（releaseNotes）</label>
        <textarea id="notesInput" rows="3"></textarea>
      </div>
      <div class="field">
        <label for="changelogUrlInput">GitHub 发布页 / 更新日志链接（changelogUrl）</label>
        <input id="changelogUrlInput" type="url" placeholder="https://github.com/AceInAndroid/sonify/releases" />
      </div>
      <button class="primary" style="width:100%;padding:9px;" onclick="saveReleasePolicy()">立即保存并在线生效</button>
    </div>
  </section>

  <section class="grid-3">
    <div class="card">
      <div class="card-title"><span>30 日活跃版本分布</span></div>
      <div id="versionBars"></div>
    </div>
    <div class="card">
      <div class="card-title"><span>热门外接 USB DAC 排行</span></div>
      <div id="dacBars"></div>
    </div>
    <div class="card">
      <div class="card-title"><span>热门设备型号 & Android 版本</span></div>
      <div id="modelBars"></div>
    </div>
  </section>

  <section class="grid-2">
    <div class="card">
      <div class="card-title"><span>近 7 日核心埋点事件排行</span></div>
      <div style="overflow-x:auto;">
        <table>
          <thead><tr><th>事件名</th><th>触发次数</th><th>覆盖设备</th></tr></thead>
          <tbody id="eventsBody"></tbody>
        </table>
      </div>
    </div>
    <div class="card">
      <div class="card-title"><span>最近活跃匿名设备（Top 15）</span></div>
      <div style="overflow-x:auto;">
        <table>
          <thead><tr><th>设备</th><th>版本</th><th>USB DAC</th><th>活跃日</th></tr></thead>
          <tbody id="devicesBody"></tbody>
        </table>
      </div>
    </div>
  </section>

  <section class="card">
    <div class="card-title"><span>近期脱敏崩溃记录（最近 20 条）</span></div>
    <div id="crashesList"></div>
  </section>
</div>

<div id="toast" class="toast"></div>

<script>
let currentDays = 14;

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.style.display = 'block';
  clearTimeout(window._t);
  window._t = setTimeout(() => el.style.display = 'none', 2600);
}
function setDays(d) {
  currentDays = d;
  [7, 14, 30].forEach(n => document.getElementById('d'+n).classList.toggle('active', n === d));
  loadAll();
}
async function doLogin() {
  const token = document.getElementById('tokenInput').value.trim();
  const err = document.getElementById('loginErr');
  err.textContent = '';
  if (!token) { err.textContent = '请输入 Admin Token'; return; }
  const res = await fetch('/api/v1/admin/login', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ token })
  });
  if (res.ok) {
    document.getElementById('tokenInput').value = '';
    loadAll();
  } else {
    err.textContent = res.status === 429 ? '尝试过于频繁，请稍后再试' : '口令错误，请重试';
  }
}
async function doLogout() {
  await fetch('/api/v1/admin/logout', { method: 'POST' });
  document.getElementById('appView').style.display = 'none';
  document.getElementById('loginView').style.display = 'block';
}
document.getElementById('tokenInput').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

function renderBars(elId, rows, labelKey, valKey, cls='') {
  const el = document.getElementById(elId);
  if (!rows || !rows.length) { el.innerHTML = '<div class="empty">暂无数据</div>'; return; }
  const max = Math.max(...rows.map(r => r[valKey]), 1);
  el.innerHTML = rows.map(r => {
    const pct = Math.max(4, Math.round(r[valKey] * 100 / max));
    return `<div class="bar-row">
      <div class="bar-meta"><span class="bar-name">${esc(r[labelKey])}</span><span class="mono">${r[valKey]}</span></div>
      <div class="bar-track"><div class="bar-fill ${cls}" style="width:${pct}%"></div></div>
    </div>`;
  }).join('');
}

function renderTrendChart(trend) {
  const el = document.getElementById('trendChart');
  if (!trend || !trend.length) { el.innerHTML = '<div class="empty">暂无趋势数据</div>'; return; }
  const W = 640, H = 220, padL = 34, padR = 16, padT = 18, padB = 34;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const maxVal = Math.max(4, ...trend.map(t => Math.max(t.dau, t.newDevices)));
  const stepX = trend.length > 1 ? plotW / (trend.length - 1) : plotW;
  const yOf = v => padT + plotH - (v / maxVal) * plotH;

  let grid = '';
  for (let i = 0; i <= 4; i++) {
    const val = Math.round(maxVal * i / 4);
    const y = yOf(val);
    grid += `<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="rgba(255,255,255,0.07)" />`;
    grid += `<text x="${padL-6}" y="${y+4}" text-anchor="end" fill="#888" font-size="10">${val}</text>`;
  }

  const barW = Math.max(6, Math.min(18, stepX * 0.42));
  let bars = '', pts = [], dots = '', labels = '';
  trend.forEach((t, idx) => {
    const x = padL + idx * stepX;
    const yDau = yOf(t.dau);
    const yNew = yOf(t.newDevices);
    pts.push(`${x.toFixed(1)},${yDau.toFixed(1)}`);
    bars += `<rect x="${(x - barW/2).toFixed(1)}" y="${yNew.toFixed(1)}" width="${barW.toFixed(1)}" height="${(padT+plotH-yNew).toFixed(1)}" rx="3" fill="rgba(29,185,84,0.45)"><title>${t.day}: DAU ${t.dau} / 新增 ${t.newDevices}</title></rect>`;
    dots += `<circle cx="${x.toFixed(1)}" cy="${yDau.toFixed(1)}" r="3.6" fill="#E5A93C"><title>${t.day}: DAU ${t.dau} / 新增 ${t.newDevices}</title></circle>`;
    if (trend.length <= 14 || idx % 3 === 0 || idx === trend.length - 1) {
      labels += `<text x="${x.toFixed(1)}" y="${H-10}" text-anchor="middle" fill="#888" font-size="10">${t.day.slice(5)}</text>`;
    }
  });
  const line = `<polyline fill="none" stroke="#E5A93C" stroke-width="2.4" points="${pts.join(' ')}" />`;
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="100%" height="220">${grid}${bars}${line}${dots}${labels}</svg>`;
}

async function saveReleasePolicy() {
  const payload = {
    forceUpdate: document.getElementById('forceToggle').checked,
    minSupportedVersionCode: parseInt(document.getElementById('minVerInput').value, 10) || 1,
    releaseNotes: document.getElementById('notesInput').value,
    changelogUrl: document.getElementById('changelogUrlInput').value.trim(),
  };
  const res = await fetch('/api/v1/admin/release/policy', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify(payload),
  });
  if (res.ok) {
    showToast(payload.forceUpdate ? '已开启强制更新并立即生效' : '版本策略已更新并立即生效');
    loadAll();
  } else {
    showToast('保存失败（HTTP ' + res.status + '）');
  }
}

async function loadAll() {
  const res = await fetch('/api/v1/admin/overview?days=' + currentDays);
  if (res.status === 401) {
    document.getElementById('appView').style.display = 'none';
    document.getElementById('loginView').style.display = 'block';
    return;
  }
  const data = await res.json();
  document.getElementById('loginView').style.display = 'none';
  document.getElementById('appView').style.display = 'block';
  document.getElementById('updatedAt').textContent = '统计时区 UTC+8 · 刷新于 ' + (data.generatedAt || '').replace('T', ' ').slice(0, 19);

  const k = data.kpi;
  const d1 = k.d1Retention && k.d1Retention.rate !== null ? k.d1Retention.rate + '%' : '--';
  const d7 = k.d7Retention && k.d7Retention.rate !== null ? k.d7Retention.rate + '%' : '--';
  document.getElementById('kpiGrid').innerHTML = [
    ['今日 DAU', k.dauToday, `昨日 ${k.dauYesterday}`, 'gold'],
    ['今日新增设备', k.newToday, `累计 ${k.totalDevices} 台`, 'green'],
    ['7 日活跃 (WAU)', k.wau, '去重设备数', ''],
    ['30 日活跃 (MAU)', k.mau, '去重设备数', ''],
    ['次日 / 7日留存', d1, `D7: ${d7}`, ''],
    ['今日崩溃上报', k.crashesToday, '已脱敏堆栈', k.crashesToday > 0 ? 'red' : 'green'],
  ].map(([lbl, val, sub, cls]) => `<div class="card">
    <div class="kpi-label">${lbl}</div>
    <div class="kpi-val ${cls}">${val}</div>
    <div class="kpi-sub">${sub}</div>
  </div>`).join('');

  renderTrendChart(data.trend);
  renderBars('versionBars', data.versions, 'version', 'devices');
  renderBars('dacBars', data.dacs, 'dac', 'devices', 'green-bar');
  const modelAndSdk = (data.models || []).concat((data.sdks || []).map(s => ({ model: 'Android API ' + s.sdk, devices: s.devices })));
  renderBars('modelBars', modelAndSdk, 'model', 'devices');

  const rel = data.release;
  if (rel) {
    document.getElementById('releaseMeta').textContent =
      `当前线上：v${rel.versionName} (code ${rel.versionCode}) · 最低兼容 code ${rel.minSupportedVersionCode}`;
    const b = document.getElementById('forceBadge');
    b.textContent = rel.forceUpdate ? '强制更新中' : '普通更新';
    b.className = 'badge ' + (rel.forceUpdate ? 'force' : 'ok');
    document.getElementById('forceToggle').checked = !!rel.forceUpdate;
    document.getElementById('minVerInput').value = rel.minSupportedVersionCode || 1;
    document.getElementById('notesInput').value = rel.releaseNotes || '';
    document.getElementById('changelogUrlInput').value = rel.changelogUrl || 'https://github.com/AceInAndroid/sonify/releases';
  }

  document.getElementById('eventsBody').innerHTML = (data.topEvents || []).length
    ? data.topEvents.map(e => `<tr><td class="mono">${esc(e.name)}</td><td class="mono">${e.count}</td><td class="mono">${e.devices}</td></tr>`).join('')
    : '<tr><td colspan="3" class="empty">暂无埋点数据</td></tr>';

  document.getElementById('devicesBody').innerHTML = (data.recentDevices || []).length
    ? data.recentDevices.map(d => `<tr><td>${esc(d.model)} <span class="sub">API ${d.sdk}</span></td><td class="mono">${esc(d.version)}</td><td>${esc(d.dac)}</td><td class="mono">${esc(d.lastSeenDay)}</td></tr>`).join('')
    : '<tr><td colspan="4" class="empty">暂无活跃设备</td></tr>';

  const crRes = await fetch('/api/v1/admin/crashes?limit=20');
  const crData = crRes.ok ? await crRes.json() : { items: [] };
  document.getElementById('crashesList').innerHTML = (crData.items || []).length
    ? crData.items.map(c => `<details class="crash-item">
        <summary>
          <span><strong class="red">${esc(c.exceptionClass)}</strong> · ${esc(c.exceptionMessage || '')}</span>
          <span class="sub mono">${esc(c.deviceModel)} · v${esc(c.appVersionName)} · ${esc((c.receivedAt||'').slice(0,19).replace('T',' '))}</span>
        </summary>
        <pre class="trace">${esc(c.stackTrace || '(no stacktrace)')}</pre>
      </details>`).join('')
    : '<div class="empty">暂无崩溃上报，线上运行稳定。</div>';
}

loadAll();
</script>
</body>
</html>

server {
    listen 80;
    listen [::]:80;
    server_name sonify.zhangbing.tech;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sonify.zhangbing.tech;

    # Certbot / Let's Encrypt 证书路径（执行 certbot --nginx -d sonify.zhangbing.tech 自动生成）
    ssl_certificate     /etc/letsencrypt/live/sonify.zhangbing.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sonify.zhangbing.tech/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 128k;

    # APK 发行包由 Nginx 直接静态高速分发（原生支持 Range 断点续传）
    location /releases/ {
        alias /var/lib/sonify-server/releases/;
        default_type application/vnd.android.package-archive;
        add_header Cache-Control "public, max-age=86400";
        sendfile on;
        tcp_nopush on;
    }

    # 更新清单与脱敏崩溃上报接口反代至本机 sonify_server.py
    location /api/v1/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
    }
}
